apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-platform
  template:
    metadata:
      labels:
        app: event-platform
    spec:
      containers:
        - name: event-platform
          image: high-throughput-event-processing:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
